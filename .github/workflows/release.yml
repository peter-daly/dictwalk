name: Release

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  guard-main:
    name: guard-main
    runs-on: ubuntu-latest
    steps:
      - name: Ensure workflow runs only on main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Release workflow can only run on main. Current ref: ${GITHUB_REF}"
            exit 1
          fi

  build-wheels:
    name: wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: guard-main
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: manylinux_x86_64
          - os: ubuntu-24.04-arm
            target: manylinux_aarch64
          - os: ubuntu-24.04
            target: musllinux_x86_64
          - os: ubuntu-24.04-arm
            target: musllinux_aarch64
          - os: windows-latest
            target: win*
          - os: macos-15
            target: macosx_arm64
          - os: macos-15-intel
            target: macosx_x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        with:
          output-dir: dist
        env:
          # Build one ABI3 wheel per platform using the oldest supported CPython.
          CIBW_BUILD: "cp310-${{ matrix.target }}"
          # Install Rust inside each Linux container so it matches the container's libc.
          CIBW_BEFORE_ALL_LINUX: >-
            curl -fsSLo /tmp/rustup.sh https://sh.rustup.rs &&
            sh /tmp/rustup.sh -y --profile minimal --no-modify-path
          CIBW_ENVIRONMENT_LINUX: "PATH=$HOME/.cargo/bin:$PATH"
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=${{ matrix.os == 'macos-15-intel' && '10.15' || '11.0' }}

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-wheels-${{ strategy.job-index }}
          path: dist/*.whl

  build-sdist:
    name: sdist
    runs-on: ubuntu-latest
    needs: guard-main

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  release:
    name: publish
    runs-on: ubuntu-latest
    needs:
      - guard-main
      - build-wheels
      - build-sdist

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Download wheel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: dist-wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v7
        with:
          name: dist-sdist
          path: dist

      - name: Show distributions
        run: ls -lah dist

      - name: Resolve version
        run: echo "VERSION=$(uv version --short)" >> "$GITHUB_ENV"

      - name: Verify required ABI3 wheels
        run: |
          ls \
            "dist/dictwalk-${VERSION}-cp310-abi3-musllinux_1_2_x86_64.whl" \
            "dist/dictwalk-${VERSION}-cp310-abi3-musllinux_1_2_aarch64.whl" \
            "dist/dictwalk-${VERSION}-cp310-abi3-macosx_10_15_x86_64.whl"

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          test -n "$UV_PUBLISH_TOKEN"
          uv publish --token "$UV_PUBLISH_TOKEN" dist/*

      - name: Tag release
        run: |
          test -n "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
